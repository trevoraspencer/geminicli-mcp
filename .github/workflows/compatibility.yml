name: Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Build (typecheck + emit)
        run: npm run build
        timeout-minutes: 5

      - name: Lint
        run: npm run lint
        timeout-minutes: 5

      - name: Test (offline)
        run: npm test
        timeout-minutes: 7

      - name: Verify package bundle
        run: npm pack --dry-run
        timeout-minutes: 5
